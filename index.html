                    if (sub.id === id) {
                        return { mode: sub.surahs === 'Semua' ? 'all' : 'level', data: sub.surahs, title: `${mainLevel.name} - ${sub.name}`, id: sub.id, mainLevelName: mainLevel.name };
                    }
                }
            }
            return null;
        };

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.3); 
                    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(660, ctx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                }

                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 1);
            } catch (error) {}
        };

        // --- FUNGSI UTAMA GAME ---
        window.changeGameState = (newState) => {
            gameState = newState;
            renderApp();
        };

        window.startLevelById = (id) => {
            const data = getLevelDataById(id);
            if(data) window.startGame(data.mode, data.data, data.title, data.id);
        };

        window.startGame = (mode, data, title, playingLevelId = null) => {
            let pool = [];
            currentLevelInfo = title;
            currentPlayingId = playingLevelId;
            
            if (mode === 'level') {
                data.forEach(surahName => {
                    const s = quranData.find(x => x.surah === surahName);
                    if(s) pool.push(...s.words.map(w => ({ ...w, surah: s.surah })));
                });
            } else if (mode === 'all') {
                quranData.forEach(s => pool.push(...s.words.map(w => ({ ...w, surah: s.surah }))));
            } else if (mode === 'single') {
                const s = quranData.find(x => x.surah === data);
                if(s) pool = s.words.map(w => ({ ...w, surah: s.surah }));
            }

            let maxQuestions = pool.length; 
            
            if (playingLevelId && String(playingLevelId).includes('boss')) {
                maxQuestions = playingLevelId === '5-boss' ? 50 : 30;
            } else if (mode === 'all' && !playingLevelId) {
                maxQuestions = 50; 
            }

            const shuffledPool = shuffleArray(pool).slice(0, maxQuestions);
            const allMeanings = [];
            quranData.forEach(s => s.words.forEach(w => allMeanings.push(w.id)));

            questions = shuffledPool.map(q => {
                let wrongAnswers = allMeanings.filter(m => m !== q.id);
                wrongAnswers = shuffleArray(wrongAnswers).slice(0, 3);
                const options = shuffleArray([q.id, ...wrongAnswers]);
                return { ...q, options };
            });

            currentQuestionIndex = 0;
            score = 0;
            selectedAnswer = null;
            isCorrect = null;
            justUnlocked = false;
            gameState = 'playing';
            renderApp();
        };

        window.handleAnswerClick = (optionIndex) => {
            if (selectedAnswer !== null) return;

            const currentQ = questions[currentQuestionIndex];
            const answer = currentQ.options[optionIndex];
            
            const correct = answer === currentQ.id;
            selectedAnswer = answer;
            isCorrect = correct;
            
            if (correct) {
                playSound('correct');
                score += 10;
            } else {
                playSound('wrong');
            }

            renderApp();

            setTimeout(() => {
                nextQuestion();
            }, 1200);
        };

        const nextQuestion = () => {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                selectedAnswer = null;
                isCorrect = null;
            } else {
                const finalPercentage = (score / (questions.length * 10)) * 100;
                let newUnlock = false;

                if (finalPercentage >= 70 && currentPlayingId) {
                    playSound('win');
                    if (currentPlayingId === '5-boss') {
                        masterPassed = true;
                    }
                    
                    const currentIndex = progressionOrder.indexOf(currentPlayingId);
                    if (currentIndex >= 0 && currentIndex < progressionOrder.length - 1) {
                        const nextId = progressionOrder[currentIndex + 1];
                        const unlockedIndex = progressionOrder.indexOf(unlockedLevelId);

                        if (progressionOrder.indexOf(nextId) > unlockedIndex) {
                            unlockedLevelId = nextId;
                            newUnlock = true;
                        }
                    }
                    saveCurrentUser();
                }

                justUnlocked = newUnlock;
                gameState = 'result';
            }
            renderApp();
        };

        window.restartCurrentLevel = () => {
            if (currentPlayingId) {
                window.startLevelById(currentPlayingId);
            } else {
                const mode = currentLevelInfo.includes('Surah ') ? 'single' : 'all';
                const data = currentLevelInfo.replace('Surah ', '');
                window.startGame(mode, data, currentLevelInfo);
            }
        };

        function renderResult() {
            const maxScore = questions.length * 10;
            const percentage = (score / maxScore) * 100;
            
            const currentIndex = currentPlayingId ? progressionOrder.indexOf(currentPlayingId) : -1;
            const hasNextLevel = currentIndex >= 0 && currentIndex < progressionOrder.length - 1;
            const nextId = hasNextLevel ? progressionOrder[currentIndex + 1] : null;
            const isNextUnlocked = nextId && progressionOrder.indexOf(nextId) <= progressionOrder.indexOf(unlockedLevelId);

            let message = "";
            if (percentage === 100) message = "SEMPURNA! Luar Biasa! 🎉";
            else if (percentage >= 70) message = "LULUS! Kerja yang bagus! 🌟";
            else message = "BELUM LULUS. Yuk, coba lagi! 💪";

            const topBgClass = percentage >= 70 ? (currentLevelInfo.includes('Ujian') ? 'bg-amber-500' : 'bg-emerald-600') : 'bg-red-500';
            const iconHtml = percentage >= 70 
                ? `<i data-lucide="award" class="w-14 h-14 ${currentLevelInfo.includes('Ujian') ? 'text-amber-500' : 'text-emerald-500'}"></i>`
                : `<i data-lucide="rotate-ccw" class="w-14 h-14 text-red-400"></i>`;
            const textScoreClass = percentage >= 70 ? 'text-emerald-600' : 'text-red-500';

            let justUnlockedHtml = "";
            if (justUnlocked) {
                justUnlockedHtml = `
                    <div class="bg-gradient-to-r from-amber-100 to-yellow-100 text-amber-800 p-4 rounded-2xl mb-6 font-black animate-pulse border-2 border-amber-300 shadow-sm flex items-center justify-center gap-2">
                        <i data-lucide="star" class="w-5 h-5 fill-current"></i> TAHAP BARU TERBUKA! <i data-lucide="star" class="w-5 h-5 fill-current"></i>
                    </div>
                `;
            }

            let failedMessageHtml = "";
            if (percentage < 70 && currentPlayingId) {
                failedMessageHtml = `
                    <div class="bg-red-50 text-red-700 p-4 rounded-2xl mb-6 text-sm font-bold border-2 border-red-200">
                        ⚠️ Skor minimal 70 diperlukan untuk membuka tahap berikutnya.
                    </div>
                `;
            }

            // Tombol Cetak Piagam Jika Lulus Ujian Boss
            let certificateBtnHtml = "";
            if (percentage >= 70 && currentPlayingId && String(currentPlayingId).includes('boss')) {
                const levelData = getLevelDataById(currentPlayingId);
                const mainLevelName = levelData ? levelData.mainLevelName : "Tahap Akhir";
                
                certificateBtnHtml = `
                    <button onclick="openCertificate('${mainLevelName}')" class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-yellow-900 p-5 rounded-2xl font-black tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg text-lg transform hover:-translate-y-1 mb-2 border-2 border-yellow-300">
                        <i data-lucide="award" class="w-6 h-6"></i> KLAIM PIAGAM
                    </button>
                `;
            }

            let nextBtnHtml = "";
            if (percentage >= 70 && isNextUnlocked && nextId) {
                nextBtnHtml = `
                    <button onclick="startLevelById('${nextId}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-5 rounded-2xl font-black tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg text-lg transform hover:-translate-y-1">
                        TAHAP BERIKUTNYA <i data-lucide="arrow-right" class="w-6 h-6"></i>
                    </button>
                `;
            }

            const restartBtnClass = (percentage >= 70 && isNextUnlocked && nextId) 
                ? "bg-white hover:bg-gray-50 text-gray-700 border-2 border-gray-200" 
                : "bg-emerald-600 hover:bg-emerald-700 text-white border-b-4 border-emerald-800";

            return `
                <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4 font-sans text-gray-900 w-full">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100 text-center p-8 relative">
                        
                        <div class="absolute top-0 left-0 w-full h-32 rounded-b-[50%] -z-0 ${topBgClass}"></div>

                        <div class="relative z-10 bg-white w-28 h-28 mx-auto rounded-full flex items-center justify-center shadow-xl mb-4 border-8 border-white mt-4">
                            ${iconHtml}
                        </div>

                        <h1 class="text-3xl font-black mb-1 mt-6 tracking-wide">Sesi Selesai!</h1>
                        <p class="text-gray-500 text-sm mb-6 bg-gray-100 inline-block px-4 py-1.5 rounded-full font-bold border border-gray-200">${currentLevelInfo}</p>
                        
                        <p class="text-xl font-bold mb-6 ${textScoreClass}">
                            ${message}
                        </p>

                        ${justUnlockedHtml}
                        ${failedMessageHtml}
                        
                        <div class="bg-gray-50 rounded-3xl p-6 mb-8 border-2 border-gray-100 shadow-inner">
                            <p class="text-gray-400 font-bold mb-2 uppercase tracking-widest text-xs">Total Skor</p>
                            <div class="text-7xl font-black drop-shadow-sm ${textScoreClass}">
                                ${score} <span class="text-2xl text-gray-400 font-bold">/ ${maxScore}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-4">
                            ${certificateBtnHtml}
                            ${nextBtnHtml}

                            <button onclick="restartCurrentLevel()" class="w-full p-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all shadow-md ${restartBtnClass}">
                                <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Ulangi Tahap Ini
                            </button>
                            <button onclick="changeGameState('menu')" class="w-full bg-white hover:bg-gray-50 text-gray-500 border-2 border-gray-200 p-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all">
                                <i data-lucide="home" class="w-5 h-5"></i> Kembali ke Peta
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCertificate() {
            return `
                <div class="min-h-screen bg-gray-100 flex flex-col items-center p-4 md:p-8 font-sans text-gray-900 w-full overflow-y-auto">
                    <!-- Controls (Sembunyi saat diprint) -->
                    <div class="max-w-3xl w-full bg-white rounded-3xl shadow-xl p-6 mb-8 no-print border border-gray-200">
                        <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                            <button onclick="changeGameState('menu')" class="p-3 bg-gray-100 rounded-xl hover:bg-gray-200 text-gray-600 transition-colors flex items-center font-bold">
                                <i data-lucide="arrow-left" class="w-5 h-5 mr-1"></i> Kembali
                            </button>
                            <h2 class="font-black uppercase tracking-widest text-lg text-emerald-800 flex items-center gap-2">
                                <i data-lucide="award" class="w-6 h-6 text-amber-500"></i> Buat Piagam
                            </h2>
                        </div>

                        <div class="grid grid-cols-1 gap-6 mb-6">
                            <div>
                                <label class="block text-sm font-black tracking-wide text-gray-700 mb-2 uppercase">Unggah Foto Anak <span class="text-gray-400 font-medium normal-case">(Opsional)</span></label>
                                <input type="file" accept="image/*" onchange="handlePhotoUpload(event)" class="w-full border-2 border-gray-300 rounded-2xl file:mr-4 file:py-4 file:px-6 file:rounded-l-xl file:border-0 file:text-sm file:font-black file:bg-emerald-50 file:text-emerald-800 hover:file:bg-emerald-100 cursor-pointer">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button id="btn-download" onclick="downloadImage()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-2xl font-black tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg text-base transform hover:-translate-y-1">
                                <i data-lucide="download" class="w-5 h-5"></i> SIMPAN GAMBAR (PNG)
                            </button>
                            <button onclick="printCertificate()" class="w-full bg-gray-800 hover:bg-gray-900 text-white p-4 rounded-2xl font-black tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg text-base transform hover:-translate-y-1">
                                <i data-lucide="printer" class="w-5 h-5"></i> CETAK (PDF)
                            </button>
                        </div>
                    </div>

                    <!-- Area Piagam (Tercetak) -->
                    <div id="printable-certificate" class="w-full max-w-2xl aspect-[1/1.414] bg-white border-[16px] border-double border-emerald-800 p-4 md:p-8 flex flex-col items-center justify-center text-center relative overflow-hidden shadow-2xl mx-auto">
                        
                        <!-- Pattern Background Elegan -->
                        <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: repeating-linear-gradient(45deg, #047857 25%, transparent 25%, transparent 75%, #047857 75%, #047857), repeating-linear-gradient(45deg, #047857 25%, #ffffff 25%, #ffffff 75%, #047857 75%, #047857); background-position: 0 0, 20px 20px; background-size: 40px 40px;"></div>

                        <!-- Inner Border -->
                        <div class="relative z-10 w-full h-full border-4 border-emerald-200 p-6 md:p-10 flex flex-col items-center bg-white/95">
                            
                            <div class="flex-grow flex flex-col items-center justify-center w-full">
                                <i data-lucide="award" class="w-20 h-20 md:w-28 md:h-28 text-amber-500 mb-6 md:mb-8 fill-current drop-shadow-md"></i>
                                
                                <h1 class="text-4xl md:text-6xl font-black text-emerald-900 mb-4 md:mb-6 tracking-widest uppercase">Piagam<br/>Penghargaan</h1>
                                
                                <p class="text-base md:text-xl text-gray-600 font-bold mb-8 md:mb-10">Diberikan dengan penuh kebanggaan kepada:</p>

                                <!-- Area Foto Anak -->
                                <div class="w-32 h-44 md:w-44 md:h-56 border-4 border-dashed border-emerald-300 mb-6 md:mb-8 flex items-center justify-center bg-emerald-50 overflow-hidden relative shadow-inner">
                                    <img id="cert-photo-display" src="${certPhotoDataUrl || ''}" class="w-full h-full object-cover" style="display: ${certPhotoDataUrl ? 'block' : 'none'};" />
                                    <div id="cert-photo-placeholder" class="flex-col items-center text-emerald-400" style="display: ${certPhotoDataUrl ? 'none' : 'flex'};">
                                        <i data-lucide="camera" class="w-10 h-10 md:w-14 md:h-14 mb-2"></i>
                                        <span class="text-xs md:text-sm font-bold uppercase tracking-wider">Pas Foto</span>
                                    </div>
                                </div>

                                <!-- Nama Anak -->
                                <h2 id="cert-name-display" class="text-3xl md:text-5xl font-serif font-bold text-gray-900 mb-8 md:mb-12 border-b-2 border-emerald-800 px-8 pb-3 tracking-wide">${currentUser.name}</h2>

                                <!-- Deskripsi Kelulusan -->
                                <p class="text-sm md:text-xl text-gray-700 font-medium max-w-sm md:max-w-lg leading-relaxed mb-10 md:mb-16">
                                    Atas keberhasilan, dedikasi, dan kerja kerasnya dalam menyelesaikan seluruh evaluasi akhir untuk tahap:<br/>
                                    <strong class="text-emerald-800 text-xl md:text-3xl block mt-4 mb-2">${certLevelName}</strong>
                                    Game Edukasi Tebak Kosakata Al-Quran Juz 30.
                                </p>
                            </div>

                            <!-- Kolom Tanda Tangan & Nilai -->
                            <div class="flex justify-between w-full max-w-sm md:max-w-lg mt-auto pt-8 border-t-2 border-emerald-100">
                                <div class="text-center w-28 md:w-40">
                                    <div class="h-16 md:h-20 flex items-end justify-center">
                                        <div class="w-full border-b border-gray-800"></div>
                                    </div>
                                    <p class="text-xs md:text-sm font-bold text-gray-500 mt-3 uppercase tracking-widest">Orang Tua / Guru</p>
                                </div>
                                
                                <div class="text-center w-28 md:w-40">
                                    <div class="h-16 md:h-20 flex items-end justify-center">
                                        <div class="font-black text-emerald-800 flex items-center gap-1 md:gap-2 text-xl md:text-3xl">
                                            <i data-lucide="star" class="w-5 h-5 md:w-8 md:h-8 fill-current text-amber-400"></i>
                                            LULUS
                                            <i data-lucide="star" class="w-5 h-5 md:w-8 md:h-8 fill-current text-amber-400"></i>
                                        </div>
                                    </div>
                                    <p class="text-xs md:text-sm font-bold text-gray-500 mt-3 uppercase tracking-widest">Predikat</p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            `;
        }

        // Fungsi render utama 
        function renderApp() {
            const app = document.getElementById('app');
            if (gameState === 'login') app.innerHTML = renderLogin();
            else if (gameState === 'menu') app.innerHTML = renderMenu();
            else if (gameState === 'surahList') app.innerHTML = renderSurahList();
            else if (gameState === 'playing') app.innerHTML = renderPlaying();
            else if (gameState === 'result') app.innerHTML = renderResult();
            else if (gameState === 'certificate') app.innerHTML = renderCertificate();

            lucide.createIcons();
        }

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });

    </script>
</body>
</html>
